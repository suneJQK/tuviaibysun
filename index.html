<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tử Vi Đẩu Số Engine</title>

    <!-- 1. THÊM THƯ VIỆN ĐỂ KẾT NỐI VỚI STREAMLIT PYTHON -->
    <script src="https://unpkg.com/streamlit-component-lib@~1.4.0/dist/streamlit.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body, html { height: 100%; width: 100%; background-color: #0e1117; color: #ffffff; overflow: hidden; }

        .settings-btn {
            position: fixed; top: 10px; left: 15px; z-index: 9999;
            background: linear-gradient(135deg, #d4af37, #f6d365); color: #111;
            border: none; width: 40px; height: 40px; border-radius: 50%;
            font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        .nav-header {
            display: flex; align-items: center; justify-content: flex-end;
            background: #161922; border-bottom: 1px solid #262730; height: 55px; padding-right: 20px; gap: 10px;
        }

        .tab-btn { background: transparent; border: none; color: #a0aec0; padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: #f6d365; border-bottom: 3px solid #f6d365; }

        .top-menu {
            position: fixed; top: -100%; left: 0; width: 100vw; max-height: 85vh;
            background: #161922; border-bottom: 2px solid #f6d365; padding: 20px 30px;
            z-index: 9998; transition: top 0.35s ease-in-out; display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 20px;
        }
        .top-menu.active { top: 0; }

        .menu-group { display: flex; flex-direction: column; gap: 8px; background: #1e222d; padding: 15px; border-radius: 8px; border: 1px solid #2d3748; }
        .menu-group label { color: #f6d365; font-weight: bold; font-size: 13px; }
        .menu-group input, .menu-group textarea { background: #262730; border: 1px solid #363945; color: #fff; padding: 8px 12px; border-radius: 6px; outline: none; }

        .btn-primary { background: linear-gradient(90deg, #d4af37 0%, #f6d365 100%); color: #1a202c; font-weight: bold; border: none; padding: 10px; border-radius: 6px; cursor: pointer; }

        .content-area { height: calc(100vh - 55px); width: 100vw; padding: 15px; display: none; }
        .content-area.active { display: flex; gap: 15px; }

        .col-card { flex: 1; background: #1e222d; border-radius: 10px; border: 1px solid #262730; display: flex; flex-direction: column; overflow: hidden; }
        .card-header { padding: 12px 16px; background: #161922; color: #f6d365; font-weight: bold; border-bottom: 1px solid #262730; }
        .card-body { padding: 15px; flex: 1; overflow-y: auto; line-height: 1.6; color: #d1d5db; }
    </style>
</head>
<body>

    <button class="settings-btn" id="toggleBtn" onclick="toggleMenu()">⚙️</button>

    <div class="top-menu" id="topMenu">
        <div class="menu-group">
            <label>📸 TẢI LÁ SỐ TỬ VI</label>
            <input type="file" id="fileInput" accept="image/*">
            <label>📅 NĂM LUẬN TIỂU HẠN</label>
            <input type="number" id="yearInput" value="2026">
        </div>

        <div class="menu-group">
            <label>📐 CĂN CHỈNH LỀ LÁ SỐ</label>
            <label style="color:#aaa;">⬆️ Bỏ lề Trên (%):</label>
            <input type="range" id="topVal" min="0" max="25" value="0">
            <label style="color:#aaa;">⬇️ Bỏ lề Dưới (%):</label>
            <input type="range" id="botVal" min="0" max="25" value="3">
        </div>

        <div class="menu-group">
            <label>📝 YÊU CẦU BỔ SUNG</label>
            <textarea id="noteInput" rows="2">Phân tích kỹ Cách Cục và vận hạn năm.</textarea>
            <button class="btn-primary" onclick="submitToPython()">🔮 BẮT ĐẦU LUẬN GIẢI</button>
        </div>
    </div>

    <div class="nav-header">
        <button class="tab-btn active" onclick="switchTab('tab-main', this)">☯️ Luận Giải Lá Số</button>
        <button class="tab-btn" onclick="switchTab('tab-books', this)">📚 Kho Dữ Liệu Sách & Phú</button>
        <button class="tab-btn" onclick="switchTab('tab-contact', this)">🔗 Liên Hệ & Hỗ Trợ</button>
    </div>

    <div id="tab-main" class="content-area active">
        <div class="col-card">
            <div class="card-header">💬 TRÒ CHUYỆN & HỎI ĐÁP</div>
            <div class="card-body">
                <p style="color: #a0aec0;">Bấm vào <b>⚙️ Bánh Răng</b> để chọn ảnh và gửi dữ liệu sang Python xử lý.</p>
            </div>
        </div>
        <div class="col-card">
            <div class="card-header">📜 KẾT QUẢ LUẬN GIẢI CHI TIẾT</div>
            <div class="card-body" id="analysisBox">
                <!-- ANALYSIS_RESULT -->
            </div>
        </div>
    </div>

    <div id="tab-books" class="content-area">
        <div class="col-card">
            <div class="card-header">📚 DỮ LIỆU KHO SÁCH JSON CACHE</div>
            <div class="card-body">
                <p>Kích thước dữ liệu: <b>/* BOOK_SIZE_DATA */</b></p>
                <ul id="bookList"></ul>
            </div>
        </div>
    </div>

    <div id="tab-contact" class="content-area">
        <div class="col-card">
            <div class="card-header">🔗 THÔNG TIN LIÊN HỆ</div>
            <div class="card-body"><p>Mọi thắc mắc vui lòng liên hệ hệ thống quản trị.</p></div>
        </div>
    </div>

    <script>
        // 2. KHỞI TẠO STREAMLIT COMPONENT
        function onStreamlitReady() {
            Streamlit.setComponentReady();
            Streamlit.setFrameHeight(window.innerHeight);
        }
        window.addEventListener("DOMContentLoaded", onStreamlitReady);

        function switchTab(tabId, btn) {
            document.querySelectorAll('.content-area').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function toggleMenu() {
            const menu = document.getElementById('topMenu');
            const btn = document.getElementById('toggleBtn');
            menu.classList.toggle('active');
            btn.innerText = menu.classList.contains('active') ? '✖' : '⚙️';
        }

        // 3. HÀM TRUYỀN DỮ LIỆU TỪ HTML VỀ STREAMLIT PYTHON
        function submitToPython() {
            const fileInput = document.getElementById('fileInput');
            const year = document.getElementById('yearInput').value;
            const note = document.getElementById('noteInput').value;

            if (!fileInput.files[0]) {
                alert("Vui lòng tải lên ảnh lá số!");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                const base64Data = e.target.result; // Chuyển ảnh thành Base64 string

                // GỬI DỮ LIỆU VỀ PYTHON
                Streamlit.setComponentValue({
                    action: "ANALYZE",
                    image: base64Data,
                    year: year,
                    note: note
                });
                
                toggleMenu();
                document.getElementById('analysisBox').innerHTML = "<p style='color:#f6d365;'>⚡ Đang gửi dữ liệu sang Python và gọi Gemini API...</p>";
            };

            reader.readAsDataURL(file);
        }

        // Render danh sách sách
        const bookData = /* BOOK_TITLES_DATA */ [];
        const bookListEl = document.getElementById('bookList');
        if (Array.isArray(bookData) && bookData.length > 0) {
            bookData.forEach(item => {
                const li = document.createElement('li');
                li.innerText = item;
                bookListEl.appendChild(li);
            });
        }
    </script>
</body>
</html>
