<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tử Vi Đẩu Số Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body, html { height: 100%; width: 100%; background-color: #0e1117; color: #ffffff; overflow: hidden; }
        
        .main-layout {
            display: flex;
            width: 100vw;
            height: 100vh;
            gap: 12px;
            padding: 12px;
        }

        .col-left {
            flex: 1;
            background: #1e222d;
            border-radius: 10px;
            border: 1px solid #262730;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .col-right {
            flex: 1.4;
            background: #1e222d;
            border-radius: 10px;
            border: 1px solid #262730;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .card-header {
            padding: 12px 16px;
            background: #161922;
            color: #f6d365;
            font-size: 16px;
            font-weight: 700;
            border-bottom: 1px solid #262730;
        }

        .card-body {
            padding: 16px;
            flex: 1;
            overflow-y: auto;
            line-height: 1.6;
            color: #d1d5db;
        }

        .card-body::-webkit-scrollbar { width: 6px; }
        .card-body::-webkit-scrollbar-thumb { background-color: #363945; border-radius: 4px; }
        .card-body::-webkit-scrollbar-thumb:hover { background-color: #f6d365; }

        .chat-bubble {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
        }
        .chat-user { background: #2d3748; color: #f6d365; }
        .chat-ai { background: #1a202c; border: 1px solid #363945; color: #e2e8f0; }
    </style>
</head>
<body>
    <div class="main-layout">
        <div class="col-left">
            <div class="card-header">💬 TRÒ CHUYỆN & HỎI ĐÁP LÁ SỐ</div>
            <div class="card-body">
                <!-- CHAT_HISTORY_PLACEHOLDER -->
            </div>
        </div>

        <div class="col-right">
            <div class="card-header">📜 BÀI LUẬN GIẢI TỰ ĐỘNG (GEMINI)</div>
            <div class="card-body">
                <!-- ANALYSIS_RESULT_PLACEHOLDER -->
            </div>
        </div>
    </div>
</body>
</html>
